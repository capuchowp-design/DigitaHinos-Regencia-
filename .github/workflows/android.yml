name: Gerar APK (Android)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Se os 4 segredos de assinatura existirem, também é gerado o APK de release assinado
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # O runner ubuntu-latest já traz o Android SDK; basta aceitar as licenças
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Descobrir versão do build-tools
        id: bt
        run: echo "v=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android (se ainda não existir)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Gerar ícones e splash
        run: npx capacitor-assets generate --android --assetPath assets
        continue-on-error: true
      - name: Versão do app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle || true
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle || true
      - name: Sincronizar web -> Android
        run: npx cap sync android
      - name: Build debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Guardar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: regencia-ccb-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build release
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Assinar APK release
        if: env.HAS_KEYSTORE == 'true'
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ steps.bt.outputs.v }}
      - name: Guardar APK assinado
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regencia-ccb-release-apk
          path: ${{ steps.sign.outputs.signedReleaseFile }}
      - name: Publicar na página de Releases (quando for uma tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.sign.outputs.signedReleaseFile }}
