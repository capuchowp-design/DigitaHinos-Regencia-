<!DOCTYPE html>
<html lang="pt-BR" data-theme="night"><head><meta charset="utf-8"><title>Regência CCB</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050407"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#050407;--p:#0f0a12;--p2:#2a1830;--ink:#f6eaf2;--mut:#b78fa8;--acc:#ff7eb9;--acc2:#ffc2e2;--st:#9cc4c4;--g1:rgba(255,64,160,.30);--g2:rgba(168,60,255,.20);--pg:linear-gradient(155deg,rgba(255,110,180,.16),rgba(255,110,180,0) 55%),#0f0a12}
[data-theme=light]{--bg:#fff4f9;--p:#fff;--p2:#fbe0ee;--ink:#2b1020;--mut:#8a5c78;--acc:#d6338a;--acc2:#8a3cff;--g1:rgba(255,120,190,.38);--g2:rgba(180,120,255,.22);--pg:linear-gradient(155deg,rgba(255,130,190,.22),rgba(255,130,190,0) 60%),#fff}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;color:var(--ink);font:14px system-ui,sans-serif;background:radial-gradient(900px 620px at 88% -8%,var(--g1),transparent 70%),radial-gradient(760px 560px at -8% 108%,var(--g2),transparent 70%),var(--bg);background-attachment:fixed}
#side{width:270px;background:var(--pg);display:flex;flex-direction:column;border-right:1px solid var(--p2)}
#side h1{font-size:16px;margin:12px;color:var(--acc)}#q{margin:0 12px 8px;padding:8px;border-radius:8px;border:1px solid var(--p2);background:var(--bg);color:var(--ink)}
#list{overflow:auto;flex:1}#list div{padding:7px 12px;cursor:pointer;border-left:3px solid transparent}#list div:hover{background:var(--p2)}
#list div.on{background:var(--p2);border-color:var(--acc);color:var(--acc)}#list b{color:var(--acc);margin-right:6px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--pg);flex-wrap:wrap;border-bottom:1px solid var(--p2)}
#bar h2{margin:0;font-size:17px;flex:1;min-width:200px}#bar small{color:var(--mut);display:block;font-weight:400}
#cfg{display:contents}#cf,#mn{display:none}
button,select,input[type=number]{background:var(--p2);color:var(--ink);border:1px solid var(--acc);border-radius:8px;padding:6px 10px;font:inherit}
button{cursor:pointer}button:hover{background:var(--acc);color:#14060e}input[type=range]{width:78px;accent-color:var(--acc)}
#body{flex:1;display:flex;min-height:0}#score{flex:1;overflow:auto;padding:10px;background:var(--pg);margin:10px 0 10px 10px;border-radius:14px;border:1px solid var(--p2)}
#score svg{background:#fbf7fa;border-radius:8px}
#cond{width:340px;margin:10px;display:flex;flex-direction:column;gap:10px}
.c{background:var(--pg);border-radius:14px;padding:10px;border:1px solid var(--p2)}.ct{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:4px}
#info{overflow:auto;flex:1;font-size:13px;line-height:1.5}#inf b{color:var(--acc)}#st{font-weight:700;min-height:20px;margin-bottom:4px}#st2{display:none;font-weight:700;font-size:13px;text-align:center}
#lt{color:var(--acc);font-weight:600;min-height:18px;font-size:12.5px}#lh{display:block;max-height:210px}
#cs text,#lh text{fill:var(--ink)}
#score svg{--ink:#10282c;--st:#3b5a5c}#score svg text{fill:var(--ink)}.l{stroke:var(--st)}.hl{fill:#d6338a!important;stroke:#d6338a!important}
.imo{display:none}#snd{font-size:12px;color:var(--mut);margin-bottom:4px}#score svg .dm{fill:#9c2a62!important}#score svg .dma{fill:#e0288c!important}
body.sg #score{overflow:hidden;display:flex;align-items:center;justify-content:center}body.sg #score svg{max-height:100%}
/* ===== celular: Configurações / Partitura / Mãos / Orientações ===== */
@media(max-width:900px){
 body{height:100dvh}#side{position:fixed;z-index:9;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;width:80vw;max-width:300px}#side.open{transform:none;box-shadow:0 0 40px #000a}
 #mn,#cf{display:inline-block}#bar{padding:8px 10px;gap:6px}#bar h2{font-size:15px;min-width:120px}
 #cfg{display:none;width:100%;flex-wrap:wrap;gap:8px;align-items:center;padding-top:6px;border-top:1px solid var(--p2)}body.cfg #cfg{display:flex}
 #body{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"sc sc" "lh rh" "inf inf";gap:10px;padding:10px;overflow:auto;align-content:start}
 #score{grid-area:sc;margin:0;height:auto!important;min-height:120px}#cond{display:contents}
 #lhp{grid-area:lh}#rhp{grid-area:rh}#info{grid-area:inf;flex:none}
}
/* ===== modo imersivo ===== */
body.imm{height:100dvh}body.imm #side,body.imm .adv,body.imm #inf,body.imm #cf{display:none!important}body.imm .imo{display:inline-block}
body.imm #cfg{display:flex!important;gap:6px;align-items:center;flex-wrap:wrap;width:auto;border:0;padding:0}
body.imm #bar{padding:6px 8px;gap:6px;flex-wrap:nowrap;overflow-x:auto}body.imm #bar h2{font-size:14px;min-width:0;flex:1 1 90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.imm #bar small{display:none}
body.imm #body{display:flex;flex-direction:column;overflow:hidden;padding:0}
body.imm #cond{display:flex;width:auto;margin:6px;flex:none;flex-direction:row;height:44vh;gap:6px}
body.imm #cond .c{flex:1;padding:6px;display:flex;flex-direction:column;min-width:0}body.imm #lhp{order:-1;flex:.7}
body.imm #cs,body.imm #lh{flex:1;min-height:0;width:100%}body.imm #info{display:none!important}
body.imm #st2{display:block}body.imm #vol,body.imm #cfg>span[title]{display:none}body.imm #bar button{padding:5px 8px}body.imm #score{flex:1 1 auto;margin:0 6px 6px;height:auto!important}
@media(orientation:landscape) and (max-height:620px){body.imm #body{flex-direction:row}body.imm #cond{flex-direction:column;width:44%;height:auto;margin:6px}body.imm #lhp{order:0;flex:1}body.imm #rhp{flex:1.6}body.imm #score{margin:6px 6px 6px 0}}
</style></head><body>
<div id="side"><h1>♪ Regência · CCB</h1><input id="q" placeholder="Buscar nº ou título…"><div id="list"></div></div>
<div id="main"><div id="bar"><button id="mn">☰ Hinos</button><h2 id="t"></h2><button id="pl">▶ Reger</button><button id="sp" title="Parar">⏹</button><button id="cf">⚙ Configurações</button>

<select id="sty" class="adv"><option value="cont">Curvas do manual (contínuo)</option><option value="art">Curvas, ictus marcado</option><option value="geo">Linhas retas (geométrico)</option></select>
<span class="adv">♩=<input id="bpm" type="number" min="30" max="200" style="width:64px"></span><button id="bm" class="imo">♩−</button><button id="bp" class="imo">♩+</button>
<select id="ins" class="adv" title="Instrumento"><option value="org">Órgão (igreja)</option><option value="orq">Orquestra</option><option value="cor">Cordas</option><option value="mad">Madeiras</option><option value="met">Metais</option><option value="pno">Piano</option><option value="sin">Sintetizador (sem internet)</option></select><span title="Volume">🔊</span><input id="vol" type="range" min="0" max="100" value="70">
<button id="zm" title="Menor">A−</button><button id="zp" title="Maior">A+</button><button id="sg" class="adv" title="Mostrar uma pauta por vez">▭ Pauta única</button><button id="im" class="adv" title="Modo imersivo (tela cheia)">⛶ Imersivo</button><button id="xm" class="imo">✕ Sair</button><button id="th" class="adv">☀/☾</button></div></div>
<div id="body"><div id="score"></div><div id="cond">
<div class="c" id="rhp"><div class="ct">Mão direita</div><svg id="cs" viewBox="0 0 300 300" width="100%"></svg><div id="st2"></div></div>
<div class="c" id="lhp"><div class="ct">Mão esquerda</div><svg id="lh" viewBox="0 0 160 240" width="100%"></svg><div id="lt"></div></div>
<div class="c" id="info"><div class="ct">Orientações</div><div id="st"></div><div id="snd"></div><div id="inf"></div></div></div></div></div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const E=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const H=window.HINOS;let cur,sc,A,zs=1.1,state=0,ctx,mg,wave,comp,T0=0,raf,vol=.7,lastS=0,evc={},single=innerWidth<900,imm=false,zsS=.8,wl=null;
try{const t=localStorage.th;if(t)document.documentElement.dataset.theme=t;const z=+localStorage.zs;if(z)zs=z;const y=+localStorage.zss;if(y)zsS=y;if(localStorage.sg)single=localStorage.sg=='1'}catch(e){}
$('#mn').onclick=()=>$('#side').classList.toggle('open');
$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.theme=='night'?'light':'night';d.dataset.theme=n;try{localStorage.th=n}catch(e){}if(A&&A.o){drawCond();place(lastS)}};
function fill(f=''){const L=$('#list');L.innerHTML='';f=f.toLowerCase();H.forEach((h,i)=>{if(f&&!(String(h.n).padStart(3,'0')+' '+h.t.toLowerCase()).includes(f))return;
const d=document.createElement('div');d.innerHTML=`<b>${String(h.n).padStart(3,'0')}</b>${h.t}`;d.dataset.i=i;d.onclick=()=>load(i);if(cur==h)d.className='on';L.appendChild(d)})}
$('#q').oninput=e=>fill(e.target.value);
// ================= DINÂMICA (partitura = som = mão esquerda) =================
const STEPS=[{n:'p',v:.34},{n:'mp',v:.46},{n:'mf',v:.58},{n:'f',v:.72}],dyc={};
function buildDyn(h){if(dyc[h.n])return dyc[h.n];
 const ms=[];let a=0;h.m.forEach(m=>{ms.push(a);a+=m.d});const top=[];
 h.m.forEach((m,i)=>{const best={};m.n.forEach(n=>{if(n[2]==0&&n[4]>=0){const k=n[0];if(best[k]==null||n[4]>best[k].d)best[k]={d:n[4],w:n[1]}}});Object.values(best).forEach(b=>top.push({i,d:b.d,w:b.w}))});
 let lo=1e9,hi=-1e9;top.forEach(t=>{lo=Math.min(lo,t.d);hi=Math.max(hi,t.d)});
 const c=h.m.map((m,i)=>{let s=0,w=0;top.forEach(t=>{if(t.i==i){s+=t.d*t.w;w+=t.w}});return w&&hi>lo?(s/w-lo)/(hi-lo):.5});
 const nm=h.m.length,brk=new Set();h.m.forEach((m,i)=>{if(m.n.some(n=>n[6]&4&&n[2]==0))brk.add(i+1)});
 const cs=c.map((v,i)=>{const p=brk.has(i)||i==0?v:c[i-1],n=brk.has(i+1)||i==nm-1?v:c[i+1];return(p+2*v+n)/4});
 const dv=cs.map((v,i)=>.3+.5*v-(brk.has(i+1)&&i>0?.05:0));
 const qz=v=>{let b=0;STEPS.forEach((s,k)=>{if(Math.abs(s.v-v)<Math.abs(STEPS[b].v-v))b=k});return b};
 const marks=[];let cur=-1,last=-9;
 dv.forEach((v,i)=>{const s=qz(v),ps=brk.has(i);if(i==0){marks.push({mi:0,q:0,step:s});cur=s;last=0;return}
  if(s!=cur&&(i-last>=2||ps)&&(ps||i==nm-1||qz(dv[i+1])==s)){marks.push({mi:i,q:ms[i],step:s});cur=s;last=i}});
 const hairs=[];for(let k=0;k<marks.length-1;k++){const x=marks[k],y=marks[k+1];if(y.mi-x.mi>=2&&x.step!=y.step&&!brk.has(y.mi))hairs.push({mi0:x.mi,mi1:y.mi,q0:x.q,q1:y.q,dir:y.step>x.step?1:-1})}
 const pts=[];marks.forEach((m,k)=>{const L=STEPS[m.step].v,nx=marks[k+1];pts.push([m.q,L]);if(nx){const L2=STEPS[nx.step].v;if(hairs.some(x=>x.mi0==m.mi))pts.push([m.q+.5,L]);else if(L2!=L)pts.push([Math.max(m.q+.5,nx.q-.25),L])}});
 pts.push([a+1,STEPS[marks[marks.length-1].step].v]);
 return dyc[h.n]={marks,hairs,pts,ms}}
function dynAt(h,q){const p=buildDyn(h).pts;if(q<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++)if(q<p[i+1][0]){const t=(q-p[i][0])/((p[i+1][0]-p[i][0])||1);return p[i][1]+(p[i+1][1]-p[i][1])*t}return p[p.length-1][1]}
// ================= PARTITURA =================
const PAL=['','#7d77ff','#3ddc84','#ff4d5a','#ffb347','#4db8ff','#ff7eb9','#ffe066','#6ee7e7','#c0ff72','#b388ff','#ff9f68'],pc=i=>{const g=Math.floor(i/A.kg)%PAL.length;return g?PAL[g]:(document.documentElement.dataset.theme=='light'?'#1b1b1b':'#f4f4f4')};
const ST=[0,2,4,5,7,9,11],SH=[3,0,4,1,5,2,6],FL=[6,2,5,1,4,0,3],TSH=[38,35,39,36,33,37,34],TFL=[34,37,33,36,32,35,31],sp=10;
const keyAl=k=>{const a=Array(7).fill(0);(k>0?SH.slice(0,k):FL.slice(0,-k)).forEach(s=>a[s]=k>0?1:-1);return a};
const MUS=(()=>{try{const c=document.createElement('canvas').getContext('2d');c.font='32px serif';return c.measureText('𝄞').width!==c.measureText('\u{10FFFD}').width}catch(e){return false}})();
function score(h,W){
 const root=E('svg',{viewBox:`0 0 ${W} 10`}),R=h.clefs.length,RH=4*sp,gap=82,sysH=R*RH+(R-1)*gap+84;
 let k=h.k,ts=h.ts;const meta=[];
 h.m.forEach(m=>{if(m.k!=null)k=m.k;if(m.ts)ts=m.ts;
  const on=[...new Set(m.n.map(n=>n[0]))].sort((a,b)=>a-b),lyw={};m.n.forEach(n=>{lyw[n[0]]=Math.max(lyw[n[0]]||0,n[7].length*8+10)});
  const xs=[];let x=22;on.forEach((o,j)=>{xs.push([o,x]);const dd=(on[j+1]??m.d)-o;x+=Math.max(34+18*Math.pow(Math.min(Math.max(dd,.25),4),.7),lyw[o]||0)});
  meta.push({m,xs,w:x+12,k,ts:m.ts,tsc:ts})});
 meta[0].ts=h.ts;
 const hd=m=>50+Math.abs(m.k)*10+(m.ts?30:0);
 const sys=[];let cl=[],cw=0;
 meta.forEach(m=>{const hw=hd(cl.length?cl[0]:m);if(cl.length&&cw+m.w>W-24-hw){sys.push(cl);cl=[];cw=0}cl.push(m);cw+=m.w});sys.push(cl);
 const dy=buildDyn(h),mkm={},hrm={},dm=[];dy.marks.forEach(m=>mkm[m.mi]=m);dy.hairs.forEach(x=>{for(let i=x.mi0;i<x.mi1;i++)hrm[i]=x});
 const mp=[],els=[],pos=[];let mi=0;
 sys.forEach((S,si)=>{const y0=si*sysH+40,hw=hd(S[0]),x0=12;
  for(let r=0;r<R;r++){const yt=y0+r*(RH+gap),F=h.clefs[r]=='F',d0=F?18:30;
   for(let i=0;i<5;i++)E('line',{x1:x0,x2:W-12,y1:yt+i*sp,y2:yt+i*sp,class:'l','stroke-width':1},root);
   E('line',{x1:x0,x2:x0,y1:yt,y2:yt+RH,class:'l','stroke-width':1.5},root);
   if(MUS)E('text',{x:x0+4,y:yt+(F?2:3)*sp,'font-size':sp*3},root).textContent=F?'𝄢':'𝄞';
   else E('text',{x:x0+6,y:yt+(F?3.2:3.6)*sp,'font-size':sp*3.6,'font-family':'serif','font-style':'italic','font-weight':700},root).textContent=F?'F':'G';
   const sg=S[0].k>0,arr=sg?TSH:TFL;for(let j=0;j<Math.abs(S[0].k);j++)E('text',{x:x0+40+j*10,y:yt+RH-(arr[j]+(F?-14:0)-d0)*sp/2+4,'font-size':sp*1.5},root).textContent=sg?'♯':'♭';
   if(S[0].ts)['0','1'].forEach(i=>E('text',{x:x0+46+Math.abs(S[0].k)*10,y:yt+(i==0?2*sp-1:4*sp-1),'font-size':sp*2.2,'font-weight':700,'font-family':'serif','text-anchor':'middle'},root).textContent=S[0].ts[i]);
  }
  const tot=S.reduce((a,m)=>a+m.w,0),f=(W-24-hw)/tot;let x=x0+hw;
  S.forEach(M=>{const mw=M.w*f,al=keyAl(M.k),ent={sys:si,x0:x,x1:x+mw,y0,y1:y0+(R-1)*(RH+gap)+RH,xs:M.xs.map(([o,xx])=>[o,x+xx*f]),d:M.m.d};mp.push(ent);
   E('text',{x:x+3,y:y0-10,'font-size':11,fill:'var(--mut)'},root).textContent=mi+1;
   const gb=(M.tsc[1]==8&&M.tsc[0]%3==0)?1.5:1;
   for(let r=0;r<R;r++){const yt=y0+r*(RH+gap),d0=h.clefs[r]=='F'?18:30,Y=d=>yt+RH-(d-d0)*sp/2,acc={};
    const ns=M.m.n.filter(n=>n[2]==r),vs=new Set(ns.map(n=>n[3])),X=o=>ent.xs.find(a=>a[0]==o)[1];
    const gm={};ns.forEach(n=>{const kk=n[0]+'/'+n[3];(gm[kk]=gm[kk]||{o:n[0],v:n[3],dur:n[1],n:[]}).n.push(n)});
    const gl=Object.values(gm).sort((a,b)=>a.v-b.v||a.o-b.o);
    gl.forEach(g=>{g.rest=g.n[0][4]<0;g.xx=X(g.o);if(!g.rest){g.ds=g.n.map(n=>n[4]);g.ys=g.ds.map(Y);g.hi=Math.min(...g.ys);g.lo=Math.max(...g.ys);g.up=vs.size>1?g.v==1:(g.ds.reduce((a,b)=>a+b)/g.ds.length<d0+4)}});
    for(let i=0;i<gl.length;){const g=gl[i];if(g.rest||g.dur>=1){i++;continue}
     const b=[g];let j=i+1;while(j<gl.length&&gl[j].v==g.v&&!gl[j].rest&&gl[j].dur<1&&Math.floor((gl[j].o+1e-6)/gb)==Math.floor((g.o+1e-6)/gb)&&Math.abs(gl[j-1].o+gl[j-1].dur-gl[j].o)<1e-3){b.push(gl[j]);j++}
     if(b.length>1){const up=b.filter(x=>x.up).length*2>=b.length,by=up?Math.min(...b.map(x=>x.hi))-3.6*sp:Math.max(...b.map(x=>x.lo))+3.6*sp,sx=x=>x.xx+(up?5.2:-5.2);
      b.forEach(x=>{x.up=up;x.bm=by});E('line',{x1:sx(b[0])-.7,x2:sx(b[b.length-1])+.7,y1:by,y2:by,stroke:'var(--ink)','stroke-width':4.4},root);
      for(let q=0;q<b.length;q++)if(b[q].dur<=.25){const nx=b[q+1]&&b[q+1].dur<=.25?b[q+1]:null,y=by+(up?6:-6);if(nx)E('line',{x1:sx(b[q]),x2:sx(nx),y1:y,y2:y,stroke:'var(--ink)','stroke-width':3.4},root);else if(q>0&&b[q-1].dur>.25||q==b.length-1&&b.length>1&&b[q-1].dur>.25)E('line',{x1:sx(b[q])-(q?6:0),x2:sx(b[q])+(q?0:6),y1:y,y2:y,stroke:'var(--ink)','stroke-width':3.4},root)}}
     i=j}
    gl.forEach(g=>{const xx=g.xx,dur=g.dur,yy=yt+2*sp;
     if(g.rest){if(dur>=4)E('rect',{x:xx-6,y:yt+sp,width:12,height:5,fill:'var(--ink)'},root);else if(dur>=2)E('rect',{x:xx-6,y:yy-5,width:12,height:5,fill:'var(--ink)'},root);
      else if(dur>=1)E('path',{d:`M${xx-2} ${yy-11}l6 6-7 7 6 6`,stroke:'var(--ink)',fill:'none','stroke-width':2},root);
      else E('path',{d:`M${xx-4} ${yy-5}q4 3 6 -3l-5 14`,stroke:'var(--ink)',fill:'none','stroke-width':1.8},root);return}
     g.n.forEach(n=>{const y=Y(n[4]);
      for(let d=d0-2;d>=n[4];d-=2)E('line',{x1:xx-9,x2:xx+9,y1:Y(d),y2:Y(d),class:'l'},root);
      for(let d=d0+10;d<=n[4];d+=2)E('line',{x1:xx-9,x2:xx+9,y1:Y(d),y2:Y(d),class:'l'},root);
      if(n[5]!=null){acc[n[4]]=n[5];E('text',{x:xx-18,y:y+5,'font-size':sp*1.5},root).textContent=n[5]>0?'♯':n[5]<0?'♭':'♮'}
      const el=E('ellipse',{cx:xx,cy:y,rx:5.8,ry:4.2,transform:`rotate(-20 ${xx} ${y})`,fill:dur>=2?'none':'var(--ink)',stroke:'var(--ink)','stroke-width':1.4},root);
