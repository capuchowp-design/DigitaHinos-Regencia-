 S.forEach(M=>{const mw=M.w*f,al=keyAl(M.k),ent={sys:si,x0:x,x1:x+mw,y0,y1:y0+(R-1)*(36+gap)+36,xs:M.xs.map(([o,xx])=>[o,x+xx*f]),d:M.m.d};mp.push(ent);

// ---------- regência
const BASE={1:[[.5,.85]],2:[[.5,.85],[.6,.22]],3:[[.42,.85],[.82,.5],[.52,.15]],4:[[.5,.85],[.2,.6],[.8,.55],[.5,.15]]};

const NAME={1:'em 1',2:'em 2 (binário)',3:'em 3 (ternário)',4:'em 4 (quaternário)',6:'em 6 (subdividido, legato)',9:'em 9 (subdividido)',12:'em 12 (subdividido)',1:'em 1 (andamento vivo)'};
function pattern(n){const b=n<=4?n:n%3==0&&n/3<=4?n/3:n/2;if(n<=4)return BASE[n];const B=BASE[b],k=n/b,r=[];B.forEach((p,i)=>{const q=B[(i+1)%b];for(let t=0;t<k;t++)r.push([p[0]+(q[0]-p[0])*.13*t,p[1]+(q[1]-p[1])*.13*t])});return r}

 const ms=[];let a=0;h.m.forEach(m=>{ms.push(a);a+=m.d});
 h.m.forEach((m,i)=>{const n=Math.max(1,Math.round(m.d/p));for(let j=(i==0?fj:0);j<n;j++)I.push({q:i==0?(j-si)*p:ms[i]+j*p,b:j%N})});
 const fer=[];h.m.forEach((m,i)=>m.n.forEach(n=>{if(n[6]&4&&n[2]==0&&!fer.some(f=>f.mi==i&&f.o==n[0]))fer.push({mi:i,o:n[0],q:ms[i]+n[0],dur:n[1],last:i==h.m.length-1})}));
 const first=I[0].q;let pre={q:first-p,b:(I[0].b+N-1)%N};
 fer.forEach(f=>{for(let i=I.length-1;i>0;i--)if(I[i].q>f.q+.01&&I[i].q<f.q+f.dur-.01)I.splice(i,1)});

function drawCond(){const s=$('#cs');s.innerHTML='';const P=an.pat,sty=$('#sty').value;
 const pts=P.map(px);E('path',{d:'M'+pts.map(p=>p.join(' ')).join('L'),fill:'none',stroke:'var(--acc)',opacity:.35,'stroke-width':2,'stroke-dasharray':sty=='geo'?'':'4 4'},s);
