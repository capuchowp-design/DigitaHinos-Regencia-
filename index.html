const BASE={T9:['T3',3],Q12:['Q4',3]},NN={B2:2,T3:3,Q4:4,S6:6,TD6:6,QA6:6,T9:9,Q12:12};
const NAME={B2:'em 2 (binário)',T3:'em 3 (ternário)',Q4:'em 4 (quaternário)',S6:'em 6 (padrão tradicional)',TD6:'em 6 (ternário duplo)',QA6:'em 6 (quaternário alterado)',T9:'em 9 (3 × 3)',Q12:'em 12 (4 × 3)'};
const OPT={'2/4':['B2','Q4'],'2/2':['B2','Q4'],'3/4':['T3'],'3/2':['T3'],'3/8':['T3'],'4/4':['Q4','B2'],'6/8':['S6','B2','TD6','QA6'],'6/4':['S6','B2','TD6','QA6'],'9/8':['T3','T9'],'9/4':['T3','T9'],'12/8':['Q4','Q12'],'12/4':['Q4','Q12']};
function arcsFor(pid,sty){const[bid,k]=BASE[pid]||[pid,1],p=PT[bid],o=sty=='geo'?p.pl:p.cv,a=p.ict.map(i=>o.aa[i]);if(k==1)return{o,a,pass:p.pass};
 const r=[];a.forEach((x,i)=>{const e=i<a.length-1?a[i+1]:a[0]+o.L,st=Math.min(.14,(e-x)/k);for(let t=0;t<k;t++)r.push(x+st*t)});return{o,a:r,pass:[]}}
// ================= ANÁLISE DO HINO =================
function analyse(h,pid,P){const N=NN[pid],ts=h.ts,L=ts[0]*4/ts[1],p=L/N,d0=h.m[0].d,pk=d0<L-1e-4?d0:0,si=pk?N-pk/p:0,fj=Math.max(0,Math.ceil(si-1e-6)),I=[];
 const ms=[];let a=0;h.m.forEach(m=>{ms.push(a);a+=m.d});
 h.m.forEach((m,i)=>{const n=Math.max(1,Math.round(m.d/p));for(let j=(i==0?fj:0);j<n;j++)I.push({q:i==0?(j-si)*p:ms[i]+j*p,b:j%N})});
 const fer=[];h.m.forEach((m,i)=>m.n.forEach(n=>{if(n[6]&4&&n[2]==0&&!fer.some(f=>f.mi==i&&f.o==n[0]))fer.push({mi:i,o:n[0],q:ms[i]+n[0],dur:n[1],last:i==h.m.length-1})}));
 const pre={q:I[0].q-p,b:(I[0].b+N-1)%N};
 fer.forEach(f=>{for(let i=I.length-1;i>0;i--)if(I[i].q>f.q+.01&&I[i].q<f.q+f.dur-.01)I.splice(i,1)});
 I.unshift(pre);const last=I[I.length-1];I.push({q:last.q+p,b:(last.b+1)%N});
 const spq=60/P,holds=fer.map(f=>({q:f.q,ex:Math.max(1.1,f.dur*spq*.9),last:f.last})).sort((x,y)=>x.q-y.q);
 return{pid,N,p,I,fer,holds,ms,qEnd:a,pk,pre:pre.b+1,start:I[1].b+1,spq,q0:pre.q-p,pkb:pk/p}}
function bind(A,sty){const r=arcsFor(A.pid,sty);A.o=r.o;A.ar=r.a;A.pass=r.pass;A.sty=sty;let prev=-1e9,lap=0;const L=r.o.L;
 A.I.forEach(it=>{const s=r.a[it.b];while(s+lap*L<prev-1e-6)lap++;it.arc=s+lap*L;prev=it.arc})}
const qToSec=q=>q*A.spq+A.holds.reduce((a,h)=>a+(h.q<q-1e-6?h.ex:0),0),sOfQ=q=>qToSec(q)-A.q0*A.spq;
function secToQ(s){let acc=0;s+=A.q0*A.spq;for(const h of A.holds){const so=h.q*A.spq+acc;if(s<=so)return[(s-acc)/A.spq,0];if(s<so+h.ex)return[h.q,(s-so)/h.ex,h];acc+=h.ex}return[(s-acc)/A.spq,0]}
const ease={cont:t=>.5-.5*Math.cos(Math.PI*t),art:t=>Math.pow(t,1.7),geo:t=>t},lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function gpos(q,nc){const I=A.I,o=A.o;
 if(q<I[0].q){const t=Math.max(0,Math.min(1,(q-A.q0)/A.p)),b=at(o,I[0].arc);return[b[0],b[1]-.3*(1-ease.cont(t))]}
 if(!nc&&A.cut){const c=gpos(A.qEnd-1e-6,true),t=(q-A.qEnd)/(A.p*.9);return[c[0]+.09*Math.sin(t*6.283),c[1]-.09+.09*Math.cos(t*6.283)]}
 let i=0;while(i<I.length-2&&I[i+1].q<=q)i++;
 const a=I[i],b=I[i+1],t=Math.max(0,Math.min(1,(q-a.q)/(b.q-a.q))),ps=A.pass.includes(a.b+1)||A.pass.includes(b.b+1);
 return at(o,a.arc+(b.arc-a.arc)*(ps?t:ease[A.sty](t)))}
function drawCond(){const s=$('#cs');s.innerHTML='';const o=A.o;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 o.P.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
 const k=Math.min(236/Math.max(x1-x0,.2),230/(y1-y0)),ox=150-(x0+x1)/2*k,oy=150-(y0+y1)/2*k;A.px=p=>[ox+p[0]*k,oy+p[1]*k];
 E('path',{d:o.P.map((p,i)=>(i?'L':'M')+A.px(p).map(v=>v.toFixed(1)).join(' ')).join('')+'Z',fill:'none',stroke:'var(--acc)',opacity:.6,'stroke-width':2.2,'stroke-linejoin':'round'},s);
 A.ar.forEach((a,i)=>{const p=A.px(at(o,a)),ps=A.pass.includes(i+1);E('circle',{cx:p[0],cy:p[1],r:ps?4:6,fill:ps?'none':'var(--p2)',stroke:'var(--acc)'},s);
  E('text',{x:p[0],y:p[1]+(p[1]>150?20:-10),'text-anchor':'middle','font-size':A.N>6?10:12},s).textContent=ps?`(${i+1})`:i+1});
 A.tr=E('path',{fill:'none',stroke:'var(--acc2)','stroke-width':3,opacity:.45,'stroke-linecap':'round'},s);A.dot=E('circle',{r:11,fill:'var(--acc2)',stroke:'var(--ink)','stroke-width':2},s);A.ring=E('circle',{r:0,fill:'none',stroke:'var(--acc2)','stroke-width':3},s);A.trail=[]}
function place(s){lastS=s;const[q,hf,h]=secToQ(s);A.cut=q>=A.qEnd-1e-6;const g=A.px(gpos(q));A.dot.setAttribute('cx',g[0]);A.dot.setAttribute('cy',g[1]);
 A.trail.push(g);if(A.trail.length>16)A.trail.shift();A.tr.setAttribute('d',A.trail.length>1?'M'+A.trail.map(p=>p.join(' ')).join('L'):'');
 let r=0,tx='Pronto: mãos visíveis, olhar para a orquestra.';
 if(hf){r=hf>.6?(hf-.6)*70:0;tx=h.last?'Fermata final: sustente e corte (círculo).':'Fermata: sustente; corte leve = batida preparatória.';A.dot.setAttribute('r',11+3*Math.sin(hf*20))}else A.dot.setAttribute('r',11);
 A.ring.setAttribute('cx',g[0]);A.ring.setAttribute('cy',g[1]);A.ring.setAttribute('r',r);
 if(!hf&&s>0){if(q<A.I[0].q)tx='Inspire — levare (gesto preventivo)';else if(q<A.I[1].q-.01)tx=`Gesto preventivo na batida ${A.pre} → ataque`;else if(q>=A.qEnd)tx='Fecho/corte final (círculo)';else{let i=0;while(i<A.I.length-2&&A.I[i+1].q<=q)i++;tx='Batida '+(A.I[i].b+1)}}
 $('#st').textContent=tx;if(sc)setCur(Math.max(q,0));return q}
function info(){const h=cur,ts=h.ts.join('/'),ft=A.fer.map(f=>`compasso ${f.mi+1} (${f.last?'conclusiva — corte final':'preparação — corte leve'})`);
 $('#info').innerHTML=`<b>Compasso ${ts}</b> · marcado ${NAME[A.pid]}<br><b>Andamento:</b> ♩=${$('#bpm').value} (referência).<br>`+
 (A.pk?`<b>Entrada em anacruse:</b> gesto preventivo na batida ${A.pre}, ataque na batida ${A.start}${Math.abs(A.pkb%1)>.01?' (anacruse fracionada: marque a contagem e ataque “em cima”)':''}.`:`<b>Entrada tética:</b> gesto preventivo (“cabo de guarda-chuva”) e ataque na batida 1.`)+
 `<br><b>Fermatas:</b> ${ft.length?ft.join('; '):'nenhuma'}.<br><b>Fecho:</b> movimento circular, mãos visíveis para a próxima estrofe.<br><b>Mãos:</b> a direita marca o tempo; a esquerda indica entradas, cortes e fraseado.<br><b>Desenho:</b> padrões do manual “Curso de Regência”; ${{cont:'movimento contínuo e suave',art:'ictus bem marcado (articulado)',geo:'linhas retas entre as batidas (geométrico)'}[$('#sty').value]}. `+(A.pass.length?'Batidas entre parênteses são apenas de passagem (reduza a velocidade).':'')}
// ================= ÁUDIO =================
function events(h){if(evc[h.n])return evc[h.n];const ev=[],ms=[];let a=0,k=h.k,al=keyAl(k);const open={};
 h.m.forEach((m,i)=>{ms.push(a);if(m.k!=null){k=m.k;al=keyAl(k)}const acc={};
  m.n.slice().sort((x,y)=>x[0]-y[0]).forEach(n=>{if(n[4]<0)return;const st=n[4]%7;let alt=n[5]!=null?n[5]:(acc[n[4]]!=null?acc[n[4]]:al[st]);if(n[5]!=null)acc[n[4]]=n[5];
   const key=n[2]+'/'+n[4];if(n[6]&2&&open[key]){open[key].d+=n[1];if(!(n[6]&1))delete open[key];return}
   const e={q:a+n[0],d:n[1],m:(Math.floor(n[4]/7)+1)*12+ST[st]+alt};ev.push(e);if(n[6]&1)open[key]=e});a+=m.d});
 return evc[h.n]=ev}
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();wave=ctx.createPeriodicWave(new Float32Array(7),new Float32Array([0,1,.5,.33,.2,.12,.07]));comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination)}
function play(mi=0){init();stop();ctx.resume();const s0=mi?Math.max(0,sOfQ(A.ms[mi])-A.p*A.spq):0;
 mg=ctx.createGain();mg.gain.value=vol;mg.connect(comp);T0=ctx.currentTime+.25-s0;
 events(cur).forEach(ev=>{const st=sOfQ(ev.q),en=sOfQ(ev.q+ev.d)-.04;if(st<s0-.001||en<=st)return;const t=T0+st,e=T0+en,o=ctx.createOscillator(),g=ctx.createGain();
  o.setPeriodicWave(wave);o.frequency.value=440*Math.pow(2,(ev.m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.03);g.gain.setValueAtTime(.12,Math.max(t+.04,e-.07));g.gain.linearRampToValueAtTime(0,e);
  o.connect(g);g.connect(mg);o.start(t);o.stop(e+.03)});
 state=1;$('#pl').textContent='⏸ Pausar';loop()}
const sEnd=()=>sOfQ(A.qEnd)+A.p*A.spq;
function loop(){cancelAnimationFrame(raf);const f=()=>{if(state!=1)return;const s=ctx.currentTime-T0;place(s);if(s>sEnd()){stop();return}raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function stop(){cancelAnimationFrame(raf);if(mg){mg.gain.cancelScheduledValues(0);mg.disconnect();mg=null}if(ctx&&ctx.state=='suspended')ctx.resume();state=0;$('#pl').textContent='▶ Reger'}
$('#pl').onclick=()=>{if(state==0)play(0);else if(state==1){ctx.suspend();state=2;$('#pl').textContent='▶ Continuar'}else{ctx.resume();state=1;$('#pl').textContent='⏸ Pausar';loop()}};
$('#sp').onclick=()=>{stop();A.trail=[];place(0);if(sc)sc.last=-1};
$('#vol').oninput=e=>{vol=e.target.value/100;if(mg)mg.gain.value=vol};
const zoom=d=>{zs=Math.max(.7,Math.min(2.2,zs+d));try{localStorage.zs=zs}catch(e){}drawScore()};
$('#zm').onclick=()=>zoom(-.15);$('#zp').onclick=()=>zoom(.15);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>sc&&drawScore(),250)});
// ================= CONTROLES =================
function setup(){const h=cur,k=h.ts.join('/'),o=OPT[k]||['T3'];$('#nb').innerHTML=o.map(n=>`<option value="${n}">${NAME[n]}</option>`).join('');
 if((k=='6/8'||k=='6/4')&&h.bpm>=90)$('#nb').value='B2';build()}
function build(){stop();A=analyse(cur,$('#nb').value,+$('#bpm').value);bind(A,$('#sty').value);drawCond();info();place(0)}
function load(i){stop();$('#side').classList.remove('open');cur=H[i];A=null;$('#t').innerHTML=`${String(cur.n).padStart(3,'0')} · ${cur.t}<small>${cur.c||''}</small>`;$('#bpm').value=Math.round(cur.bpm);
 sc=null;lastS=0;setup();drawScore();place(0);$('#score').scrollTop=0;document.querySelectorAll('#list div').forEach(d=>d.className=d.dataset.i==i?'on':'')}
$('#nb').onchange=build;$('#sty').onchange=build;$('#bpm').onchange=build;
fill();load(0);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
